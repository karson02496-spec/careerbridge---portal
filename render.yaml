databases:
  - name: careerbridge-db
    databaseName: careerbridge
    user: careerbridge
services:
  - type: web
    name: careerbridge-portal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careerbridge-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@careerbridge.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: RENDER
        value: 'true'

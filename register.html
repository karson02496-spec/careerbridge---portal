{% extends 'base.html' %}{% block title %}Create account{% endblock %}{% block content %}<section class="auth"><div class="auth-panel"><div class="eyebrow">JOIN CAREERBRIDGE</div><h1>Create your account</h1><p>Your next opportunity starts with one step.</p><form method="post"><label>I am joining as<select name="role" id="role" onchange="document.getElementById('company-field').style.display=this.value==='hr'?'block':'none'"><option value="applicant">Job seeker / Applicant</option><option value="hr">HR / Recruiter</option></select></label><label>Full name<input name="name" placeholder="Your full name" maxlength="120" required></label><label id="company-field" style="display:none">Company name<input name="company" placeholder="Your organization"></label><label>Email address<input type="email" name="email" placeholder="you@example.com" required></label><label>Password<input type="password" name="password" minlength="8" placeholder="At least 8 characters" required></label><div class="note">Recruiter accounts require admin approval before access.</div><button class="btn full">Create account →</button></form><p class="auth-foot">Already registered? <a href="{{url_for('login')}}">Log in</a></p></div></section>{% endblock %}

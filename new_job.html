{% extends 'base.html' %}{% block title %}Post a job{% endblock %}{% block content %}<section class="auth"><div class="auth-panel wide"><div class="eyebrow">RECRUITER WORKSPACE</div><h1>Post a new opening</h1><p>Help the right people find your team.</p><form method="post"><label>Job title<input name="title" placeholder="e.g. Frontend Developer" required></label><label>Department<input name="department" placeholder="e.g. Engineering" required></label><label>Location<input name="location" placeholder="e.g. Chennai / Remote" required></label><label>Salary / compensation<input name="salary" placeholder="e.g. ₹4–6 LPA" required></label><label>Employment type<select name="type"><option>Full-time</option><option>Part-time</option><option>Internship</option><option>Contract</option></select></label><label>Job description<textarea name="description" rows="7" placeholder="Describe responsibilities, requirements and benefits..." required></textarea></label><button class="btn full">Publish opening →</button></form></div></section>{% endblock %}
